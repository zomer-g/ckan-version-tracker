<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The /data console keeps the running query in the page URL. Without this,
         the browser sends that full URL as the Referer of every API call, and a
         WAF that inspects Referer for SQL keywords blocks the console outright.
         Belt to the response header's braces (app/main.py), because the static
         build is also served from caches and previews. -->
    <meta name="referrer" content="strict-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Everything between the two markers is replaced per route by
         app/services/seo.py: title, description, canonical, Open Graph and
         JSON-LD. The markers ENCLOSE the fallback rather than sitting beside
         it, so the generated <title> replaces this one instead of joining it.
         What is written here is what a build served without the API shows —
         the dev server, or dist/ opened straight from disk. -->
    <!--SEO:START-->
    <title>גרסאות לעם</title>
    <!--SEO:END-->
    <!-- The colour-scheme choice has to land BEFORE first paint, or the page
         flashes the wrong theme on every load. Kept inline and tiny for that
         reason; useTheme.ts owns it from here on. "system" deliberately leaves
         the attribute off — that is what lets prefers-color-scheme through. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("over.theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VV98LR49GS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VV98LR49GS');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
